
    <h2>Login </h2>
    {% if error %}
        <p style='color:red;'>
            {{error}}
        </p>
    {% endif %}
    <form action='/login' method='post'>

        <label> Email </label>
        <input type='email' name='email' required>
        <br><br>
        
        <label> Password </label>
        <input type='password' name='password' required>
        <br><br>

        <button type='submit'> login </button>
    </form>
